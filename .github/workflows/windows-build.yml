name: Simitone Windows build

# Builds Simitone.Windows with the same script developers use locally (tools/build.ps1)
# and publishes the result as a zip:
#   - as a workflow artifact (always), and
#   - as a rolling pre-release named "dev-build-<branch>" (pushes only), so a build can be
#     downloaded without opening the Actions UI.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (with FreeSO submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and deploy to artifacts/SimitoneWindows
        shell: pwsh
        run: ./tools/build.ps1 -Configuration Release -OutputDir artifacts/SimitoneWindows -NonInteractive

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/SimitoneWindows/* -DestinationPath artifacts/SimitoneWindows.zip -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimitoneWindows-${{ github.sha }}
          path: artifacts/SimitoneWindows.zip
          retention-days: 14

      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keeps one pre-release per branch. Its tag is moved to the newest built commit and the
          # zip asset is replaced. Failures are reported as annotations, which (unlike job logs)
          # can be read without signing in.
          $ErrorActionPreference = 'Continue'
          $branch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $tag = "dev-build-$branch"
          $notes = "Automated build of ${{ github.sha }} from branch $branch. Unzip and run Simitone.Windows.exe. Requires the .NET 9 Desktop Runtime and the ASP.NET Core 9 Runtime (both included in the .NET 9 SDK)."
          function Report($what, $out) {
            Write-Output ("::error title=Release publish failed ($what)::" + (($out | Out-String) -replace "`r?`n", ' | '))
            exit 1
          }
          $out = git tag -f $tag "${{ github.sha }}" 2>&1
          if ($LASTEXITCODE -ne 0) { Report 'git tag' $out }
          $out = git push -f origin "refs/tags/$tag" 2>&1
          if ($LASTEXITCODE -ne 0) { Report 'git push tag' $out }
          $null = gh release view $tag --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            $out = gh release upload $tag artifacts/SimitoneWindows.zip --clobber 2>&1
            if ($LASTEXITCODE -ne 0) { Report 'gh release upload' $out }
            $out = gh release edit $tag --prerelease --notes $notes 2>&1
            if ($LASTEXITCODE -ne 0) { Report 'gh release edit' $out }
          } else {
            $out = gh release create $tag artifacts/SimitoneWindows.zip --verify-tag --prerelease --title "Simitone dev build ($branch)" --notes $notes 2>&1
            if ($LASTEXITCODE -ne 0) { Report 'gh release create' $out }
          }
          exit 0
